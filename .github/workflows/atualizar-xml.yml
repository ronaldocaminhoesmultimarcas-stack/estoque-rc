name: Atualizar XML do estoque

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Gerar XML
        run: |
          python gerar_xml.py

      - name: Salvar XML atualizado
        run: |
          git config user.name "RC XML Bot"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Atualização automática do XML"
          git push
